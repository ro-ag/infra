# Reusable Rust binary release (docs/rust-ci-guide.md §6, pattern C):
# validate tag metadata + CI status, build natively per platform, sign and
# notarize the macOS arm64 binary, publish a GitHub release with checksums.
#
# Supported targets (native runner each, no cross-compiling):
#   linux amd64  (ubuntu-24.04)      -> tar.gz
#   linux arm64  (ubuntu-24.04-arm)  -> tar.gz
#   windows amd64 (windows-2025)     -> zip
#   windows arm64 (windows-11-arm)   -> zip
#   macos arm64  (macos-15)          -> zip, codesign + notarize (fail-closed)
#
# macOS signing is fail-closed: if any Apple secret is missing the release
# aborts — there is no unsigned release path (one unsigned build breaks
# Gatekeeper for every user).
#
# Set the 6 Apple secrets with apple-developer-signing/setup-github-secrets.sh.

name: Rust binary release (reusable)

on:
  workflow_call:
    inputs:
      bin:
        description: Cargo binary name (cargo build -p/--bin <bin>)
        type: string
        required: true
      ci-workflow:
        description: CI workflow file whose run must be green on the tag commit
        type: string
        default: ci.yml
      team-id:
        description: Apple Developer Team ID (for the designated-requirement check)
        type: string
        required: true
      signing-identity:
        description: codesign identity string
        type: string
        default: Developer ID Application
    secrets:
      APPLE_CERTIFICATE_BASE64:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      KEYCHAIN_PASSWORD:
        required: true
      APPLE_API_KEY:
        required: true
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER:
        required: true

permissions:
  contents: write
  actions: read # CI-status gate (gh run list)

jobs:
  validate:
    name: validate tag + CI status
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      notes: ${{ steps.notes.outputs.text }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # ancestry check

      - name: Validate tag, version, ancestry, CI status
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.]+)?$ ]] || {
            echo "::error::tag '$tag' is not semver vX.Y.Z[-pre]"; exit 1; }

          manifest_version=$(grep -m1 '^version *=' Cargo.toml | cut -d'"' -f2)
          [ "$manifest_version" = "$version" ] || {
            echo "::error::tag $tag != Cargo.toml version $manifest_version"; exit 1; }

          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::tag commit is not on origin/main"; exit 1; }

          run_id=$(gh run list --workflow "$CI_WORKFLOW" --branch main \
            --commit "$GITHUB_SHA" --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$run_id" ] || {
            echo "::error::no successful $CI_WORKFLOW run on $GITHUB_SHA"; exit 1; }
          echo "CI run $run_id is green — proceeding without re-running tests."

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          text=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed '/^$/d')
          [ -n "$text" ] || { echo "::error::no CHANGELOG section for $VERSION"; exit 1; }
          { echo 'text<<EOF'; echo "$text"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,      target: x86_64-unknown-linux-gnu,  os: linux,   arch: amd64, ext: tar.gz }
          - { runner: ubuntu-24.04-arm,  target: aarch64-unknown-linux-gnu, os: linux,   arch: arm64, ext: tar.gz }
          - { runner: windows-2025,      target: x86_64-pc-windows-msvc,    os: windows, arch: amd64, ext: zip    }
          - { runner: windows-11-arm,    target: aarch64-pc-windows-msvc,   os: windows, arch: arm64, ext: zip    }
          - { runner: macos-15,          target: aarch64-apple-darwin,      os: macos,   arch: arm64, ext: zip    }
    runs-on: ${{ matrix.runner }}
    env:
      BIN: ${{ inputs.bin }}
      VERSION: ${{ needs.validate.outputs.version }}
      PKG: ${{ inputs.bin }}_${{ needs.validate.outputs.version }}_${{ matrix.os }}_${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain channel
        id: tc
        shell: bash
        run: |
          ch=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml 2>/dev/null || true)
          echo "channel=${ch:-stable}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tc.outputs.channel }}
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ matrix.runner }} # warm from the main CI run

      - name: Verify native toolchain host
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}" || {
            echo "::error::rustc host != ${{ matrix.target }} — wrong architecture"; exit 1; }

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: "Contract: binary version matches tag"
        shell: bash
        run: |
          exe="target/${{ matrix.target }}/release/${BIN}"
          [ "${{ matrix.os }}" = windows ] && exe="${exe}.exe"
          out=$("$exe" --version)
          echo "$out"
          [[ "$out" == *"$VERSION"* ]] || {
            echo "::error::binary reports '$out', expected version $VERSION"; exit 1; }

      # --- macOS: sign + notarize (fail-closed) ---------------------------

      - name: Import Apple signing certificate
        if: matrix.os == 'macos'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/ci-signing.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/codesign.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/codesign.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -d user -s "$keychain"
          rm "$RUNNER_TEMP/codesign.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: Store notarization credentials
        if: matrix.os == 'macos'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          echo "$APPLE_API_KEY" | base64 -d > "$RUNNER_TEMP/AuthKey.p8" 2>/dev/null || \
            printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials ci-notarize \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --keychain "$RUNNER_TEMP/ci-signing.keychain-db"
          rm "$RUNNER_TEMP/AuthKey.p8"

      - name: Sign binary (hardened runtime + timestamp)
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          exe="target/${{ matrix.target }}/release/${BIN}"
          codesign --force --sign "${{ inputs.signing-identity }}" \
            --options runtime --timestamp "$exe"
          codesign --verify --strict --verbose=2 "$exe"
          # must be OUR Developer ID cert, not just any valid signature
          requirement='anchor apple generic and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = "${{ inputs.team-id }}"'
          codesign --verify --strict -R="$requirement" "$exe"

      # --- package ---------------------------------------------------------

      - name: Package tar.gz
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p "stage/${PKG}"
          cp "target/${{ matrix.target }}/release/${BIN}" "stage/${PKG}/"
          tar -czf "${PKG}.tar.gz" -C stage "${PKG}"

      - name: Package zip (windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          mkdir -p "stage/${PKG}"
          cp "target/${{ matrix.target }}/release/${BIN}.exe" "stage/${PKG}/"
          # Git Bash has no zip; 7z is preinstalled on windows runners
          (cd stage && 7z a -tzip "../${PKG}.zip" "${PKG}" >/dev/null)

      - name: Package zip (macos)
        if: matrix.os == 'macos'
        run: |
          mkdir -p "stage/${PKG}"
          cp "target/${{ matrix.target }}/release/${BIN}" "stage/${PKG}/"
          (cd stage && zip -q -r "../${PKG}.zip" "${PKG}")

      - name: Notarize macOS zip
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          # bare binaries can't be stapled; the notarization ticket is
          # checked online by Gatekeeper on first run
          xcrun notarytool submit "${PKG}.zip" --keychain-profile ci-notarize --wait

      - name: Clean up signing keychain
        if: always() && matrix.os == 'macos'
        run: |
          security delete-keychain "$RUNNER_TEMP/ci-signing.keychain-db" 2>/dev/null || true
          security default-keychain -d user -s login.keychain-db || true
          security list-keychains -d user -s login.keychain-db || true

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.PKG }}.${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: github release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # gh release create --verify-tag needs the repo

      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - name: "Contract: exact package set"
        env:
          BIN: ${{ inputs.bin }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "${BIN}_${VERSION}_linux_amd64.tar.gz"
            "${BIN}_${VERSION}_linux_arm64.tar.gz"
            "${BIN}_${VERSION}_windows_amd64.zip"
            "${BIN}_${VERSION}_windows_arm64.zip"
            "${BIN}_${VERSION}_macos_arm64.zip"
          )
          for f in "${expected[@]}"; do
            [ -f "dist/$f" ] || { echo "::error::missing dist/$f"; exit 1; }
            size=$(stat -c%s "dist/$f")
            [ "$size" -gt 10000 ] || { echo "::error::dist/$f suspiciously small ($size)"; exit 1; }
          done
          actual=$(ls dist)
          [ "$(echo "$actual" | wc -l)" -eq 5 ] || {
            echo "::error::unexpected files in dist: $actual"; exit 1; }
          # archives must contain exactly one top-level entry, no traversal
          for f in dist/*.tar.gz; do
            tar -tzf "$f" | grep -v '^\./' | grep -q '\.\.' && { echo "::error::path traversal in $f"; exit 1; } || true
          done

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ needs.validate.outputs.notes }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "$GITHUB_REF_NAME" --notes "$NOTES")
          [[ "$GITHUB_REF_NAME" == *-* ]] && args+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"
