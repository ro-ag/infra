# Template CI — thin caller; jobs live in ro-ag/infra.

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    types: [opened, synchronize, reopened, labeled] # labeled: run-macos gate must fire
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ro-ag/infra/.github/workflows/rust-ci.yml@main
    with:
      run-windows: true
      run-macos: >-
        ${{
          github.ref == 'refs/heads/main' ||
          github.event_name == 'workflow_dispatch' ||
          contains(github.event.pull_request.labels.*.name, 'run-macos')
        }}
