# Caller example: library release. Copy into a repo as
# .github/workflows/release.yml. Fires on v* tags; validates metadata and CI
# status, publishes crates, creates the GitHub release — without re-running
# the test suite (docs/rust-ci-guide.md §6, pattern A).

name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # required: the reusable workflow asks for contents:write, which a
    # reusable call cannot elevate above the caller's token
    permissions:
      contents: write
      actions: read # CI-status gate
    uses: ro-ag/infra/.github/workflows/rust-release.yml@4a0d020643440ed60ca0cf4fd743a5a4a4268b28 # main 2026-08-24
    with:
      # crates in dependency order, e.g.: "native-ipc-core native-ipc"
      crates: my-crate
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
