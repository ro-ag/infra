# Caller example: CI. Copy into a repo as .github/workflows/ci.yml.
# The caller owns triggers, concurrency, and path filters; the reusable
# workflow (ro-ag/infra) owns the jobs.

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    types: [opened, synchronize, reopened, labeled] # labeled: run-macos gate must fire
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ro-ag/infra/.github/workflows/rust-ci.yml@4a0d020643440ed60ca0cf4fd743a5a4a4268b28 # main 2026-08-24
    with:
      # Windows on PRs + main is the default policy — enable if the crate
      # has platform-specific code:
      run-windows: true
      # macOS only on main / manual runs / labeled PRs (10x minute cost):
      run-macos: >-
        ${{
          github.ref == 'refs/heads/main' ||
          github.event_name == 'workflow_dispatch' ||
          contains(github.event.pull_request.labels.*.name, 'run-macos')
        }}
      # GUI/audio crates: pass system deps once, used by both Linux jobs:
      # apt-packages: libasound2-dev libgtk-3-dev
